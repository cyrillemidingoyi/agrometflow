global:
  project_name: "Dakar_2020"
  verbose: true

climate:
  source: "tamsat"
  product: "tamsat"
  start_date: "2020-08-01"
  end_date: "2020-08-31"
  variables: ["PR"]
  bbox: [-5, 25, -20, 20]
  points:
    - lat: 14.7167
      lon: -17.4677
  output_dir: "data/climate/tamsat"

indicators:
  cumulative_rainfall:
    period: "monthly"
  rainy_days:
    threshold: 1.0
    variable: "PR"
  dry_days:
    threshold: 1.0
    variable: "PR"
  sdii:
    threshold: 1.0
    variable: "PR"
  r95p:
    percentile: 95
    variable: "PR"